services:
  # BLUE Environment (aktualna produkcja)
  app-blue:
    image: registry.wartkinurt.pl/kamz8/wartkinurt:${BLUE_TAG:-latest}
    container_name: kayak-app-blue
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      APP_URL: https://blue.wartkinurt.pl
      API_URL: https://api.blue.wartkinurt.pl
      DASHBOARD_URL: https://dashboard.blue.wartkinurt.pl
    volumes:
      - kayak_app:/var/www/html
      - kayak_storage:/var/www/html/storage
      - /home/services/kayak-prod/.env:/var/www/html/.env
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-blue.rule=Host(`blue.wartkinurt.pl`)"
      - "traefik.http.routers.app-blue.entrypoints=websecure"
      - "traefik.http.routers.app-blue.tls.certresolver=letsencrypt"

      - "traefik.http.routers.api-blue.rule=Host(`api.blue.wartkinurt.pl`)"
      - "traefik.http.routers.api-blue.entrypoints=websecure"
      - "traefik.http.routers.api-blue.tls.certresolver=letsencrypt"

      - "traefik.http.routers.dashboard-blue.rule=Host(`dashboard.blue.wartkinurt.pl`)"
      - "traefik.http.routers.dashboard-blue.entrypoints=websecure"
      - "traefik.http.routers.dashboard-blue.tls.certresolver=letsencrypt"

  # GREEN Environment (nowa wersja)
  app-green:
    image: registry.wartkinurt.pl/kamz8/wartkinurt:${GREEN_TAG:-develop}
    container_name: kayak-app-green
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      APP_URL: https://green.wartkinurt.pl
      API_URL: https://api.green.wartkinurt.pl
      DASHBOARD_URL: https://dashboard.green.wartkinurt.pl
    volumes:
      - kayak_app:/var/www/html
      - kayak_storage:/var/www/html/storage
      - /home/services/kayak-prod/.env:/var/www/html/.env
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-green.rule=Host(`green.wartkinurt.pl`)"
      - "traefik.http.routers.app-green.entrypoints=websecure"
      - "traefik.http.routers.app-green.tls.certresolver=letsencrypt"

      - "traefik.http.routers.api-green.rule=Host(`api.green.wartkinurt.pl`)"
      - "traefik.http.routers.api-green.entrypoints=websecure"
      - "traefik.http.routers.api-green.tls.certresolver=letsencrypt"

      - "traefik.http.routers.dashboard-green.rule=Host(`dashboard.green.wartkinurt.pl`)"
      - "traefik.http.routers.dashboard-green.entrypoints=websecure"
      - "traefik.http.routers.dashboard-green.tls.certresolver=letsencrypt"

  # TEST Environment
  app-test:
    image: registry.wartkinurt.pl/kamz8/wartkinurt:${TEST_TAG:-develop}
    container_name: kayak-app-test
    restart: unless-stopped
    environment:
      APP_ENV: staging
      APP_DEBUG: true
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      APP_URL: https://test.wartkinurt.pl
      API_URL: https://api.test.wartkinurt.pl
      DASHBOARD_URL: https://dashboard.test.wartkinurt.pl
    volumes:
      - kayak_app:/var/www/html
      - kayak_storage:/var/www/html/storage
      - /home/services/kayak-prod/.env:/var/www/html/.env
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-test.rule=Host(`test.wartkinurt.pl`)"
      - "traefik.http.routers.app-test.entrypoints=websecure"
      - "traefik.http.routers.app-test.tls.certresolver=letsencrypt"

      - "traefik.http.routers.api-test.rule=Host(`api.test.wartkinurt.pl`)"
      - "traefik.http.routers.api-test.entrypoints=websecure"
      - "traefik.http.routers.api-test.tls.certresolver=letsencrypt"

      - "traefik.http.routers.dashboard-test.rule=Host(`dashboard.test.wartkinurt.pl`)"
      - "traefik.http.routers.dashboard-test.entrypoints=websecure"
      - "traefik.http.routers.dashboard-test.tls.certresolver=letsencrypt"

  # PRODUCTION Router (główne domeny - kieruje do blue/green)
  nginx-production:
    image: nginx:alpine
    container_name: kayak-nginx-production
    restart: unless-stopped
    volumes:
      - kayak_app:/var/www/html
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
      - kayak_storage:/var/www/html/storage
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.production.rule=Host(`wartkinurt.pl`)"
      - "traefik.http.routers.production.entrypoints=websecure"
      - "traefik.http.routers.production.tls.certresolver=letsencrypt"
      - "traefik.http.services.production.loadbalancer.server.port=80"

      - "traefik.http.routers.production-api.rule=Host(`api.wartkinurt.pl`)"
      - "traefik.http.routers.production-api.entrypoints=websecure"
      - "traefik.http.routers.production-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.production-api.loadbalancer.server.port=80"

      - "traefik.http.routers.production-dashboard.rule=Host(`dashboard.wartkinurt.pl`)"
      - "traefik.http.routers.production-dashboard.entrypoints=websecure"
      - "traefik.http.routers.production-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.production-dashboard.loadbalancer.server.port=80"

  # POZOSTAŁE USŁUGI (wspólne dla wszystkich środowisk)
  queue-worker:
    image: registry.wartkinurt.pl/kamz8/wartkinurt:${BLUE_TAG:-latest}
    container_name: kayak-queue-prod
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      CACHE_DRIVER: redis
    volumes:
      - kayak_storage:/var/www/html/storage
      - /home/services/kayak-prod/.env:/var/www/html/.env
    networks:
      - internal

  scheduler:
    image: registry.wartkinurt.pl/kamz8/wartkinurt:${BLUE_TAG:-latest}
    container_name: kayak-scheduler-prod
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      REDIS_HOST: redis
      DB_CONNECTION: mysql
      CACHE_DRIVER: redis
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kayak_storage:/var/www/html/storage
    networks:
      - internal

  db:
    image: mariadb:latest
    container_name: mariadb-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - kayak_backups:/backups
    networks:
      - internal
      - traefik-public

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=512M
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma.rule=Host(`db.wartkinurt.pl`)"
      - "traefik.http.routers.pma.entrypoints=websecure"
      - "traefik.http.routers.pma.tls.certresolver=letsencrypt"
      - "traefik.http.services.pma.loadbalancer.server.port=80"

  redis:
    image: redis:alpine
    container_name: redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal

  backup:
    image: tiredofit/db-backup
    container_name: db-backup
    restart: unless-stopped
    environment:
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_DATABASE}
      - DB_USER=${DB_USERNAME}
      - DB_PASS=${DB_PASSWORD}
      - DB_DUMP_FREQ=10080
      - DB_DUMP_BEGIN=0000
      - DB_CLEANUP_TIME=43200
      - COMPRESSION=gz
      - SPLIT_DB=FALSE
      - CHECKSUM=SHA1
    volumes:
      - kayak_backups:/backup
    networks:
      - internal

volumes:
  kayak_app:
    name: kayak_app
  kayak_storage:
    driver: local
    driver_opts:
      type: none
      device: /home/services/kayak-prod/storage
      o: bind
  db_data:
    name: kayak_db_data
  redis_data:
    name: kayak_redis_data
  kayak_backups:
    name: kayak_backups

networks:
  traefik-public:
    external: true
  internal:
    name: kayak_internal
    driver: bridge
