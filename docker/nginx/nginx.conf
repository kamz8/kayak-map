server {
    listen 80;
    listen 443 ssl http2;
    server_name kayak-map.test;

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 100M;

    # ✅ UPSTREAM dla Vite
    upstream vite_dev {
        server kayak-vite-optimized:5173;
    }

    # ✅ VITE ASSETS (CSS, JS, Fonts)
    location ~ ^/(resources|build|assets|node_modules)/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ✅ WAŻNE: Ustaw poprawne nagłówki dla CSS
        location ~ \.css$ {
            proxy_pass http://vite_dev;
            add_header Content-Type "text/css";
        }

        # ✅ WAŻNE: Ustaw poprawne nagłówki dla JS
        location ~ \.js$ {
            proxy_pass http://vite_dev;
            add_header Content-Type "application/javascript";
        }
    }

    # ✅ VITE HMR WebSocket - POPRAWIONE
    location /_vite/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache off;
        proxy_buffering off;
    }

    # ✅ @vite/client dla HMR
    location /@vite/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ PHP/Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ✅ Storage
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ /index.php?$query_string;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
